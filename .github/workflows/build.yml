name: Instabox Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instabox-build:
    name: Wake Instabox, Sign & Build APK
    runs-on: ubuntu-latest
    env:
      INSTABOX_API_BASE: ${{ secrets.INSTABOX_API_BASE || vars.INSTABOX_API_BASE || secrets.INSTABOX_API_URL || vars.INSTABOX_API_URL || 'https://api.instabox.sh/v1' }}
      INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY || vars.INSTABOX_API_KEY || secrets.INSTABOX_TOKEN || vars.INSTABOX_TOKEN || secrets.INSTABOX_KEY || vars.INSTABOX_KEY }}
      INSTABOX_MACHINE_ID: ${{ secrets.INSTABOX_MACHINE_ID || vars.INSTABOX_MACHINE_ID || secrets.INSTABOX_MACHINE || vars.INSTABOX_MACHINE || secrets.MACHINE_ID || vars.MACHINE_ID }}
      ACTION_VERSION_NAME: Action-${{ github.run_number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Deterministic Signing Keystore on GitHub
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.STORE || vars.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || 'runami_key' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD || 'runami_pass_123456' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || vars.STORE_PASSWORD || 'runami_pass_123456' }}
          SIGNING_SEED: ${{ secrets.SIGNING_SEED || vars.SIGNING_SEED || '' }}
        run: |
          set -euo pipefail
          KEYSTORE_FILE="release-signing.jks"
          rm -f "$KEYSTORE_FILE"

          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Decoding signing keystore from KEYSTORE_BASE64..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
          else
            SEED="${SIGNING_SEED:-Akari.Runami.GPS:${KEY_ALIAS}:${STORE_PASSWORD}:${KEY_PASSWORD}}"
            echo "Generating deterministic RSA-2048 keystore from fixed repository seed..."
            cat > /tmp/GenDeterministicKeystore.java << 'EOF'
          import java.io.*;
          import java.math.BigInteger;
          import java.nio.charset.StandardCharsets;
          import java.security.*;
          import java.security.cert.Certificate;
          import java.security.cert.CertificateFactory;
          import java.security.cert.X509Certificate;
          import java.security.spec.RSAPrivateCrtKeySpec;
          import java.security.spec.RSAPublicKeySpec;

          public class GenDeterministicKeystore {
              static BigInteger derivePrime(String label, String seed) throws Exception {
                  MessageDigest md = MessageDigest.getInstance("SHA-256");
                  byte[] raw = new byte[128];
                  for (int i = 0; i < 4; i++) {
                      md.reset();
                      md.update(label.getBytes(StandardCharsets.UTF_8));
                      md.update((byte) ':');
                      md.update(seed.getBytes(StandardCharsets.UTF_8));
                      md.update((byte) i);
                      byte[] digest = md.digest();
                      System.arraycopy(digest, 0, raw, i * 32, 32);
                  }
                  raw[0] |= (byte) 0xC0;
                  raw[127] |= (byte) 0x01;
                  BigInteger e = BigInteger.valueOf(65537);
                  BigInteger cand = new BigInteger(1, raw).nextProbablePrime();
                  while (!cand.subtract(BigInteger.ONE).gcd(e).equals(BigInteger.ONE)) {
                      cand = cand.add(BigInteger.TWO).nextProbablePrime();
                  }
                  return cand;
              }

              static byte[] derTag(int tag, byte[]... parts) throws IOException {
                  ByteArrayOutputStream content = new ByteArrayOutputStream();
                  for (byte[] p : parts) content.write(p);
                  byte[] body = content.toByteArray();
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  out.write(tag);
                  int len = body.length;
                  if (len < 128) {
                      out.write(len);
                  } else if (len < 256) {
                      out.write(0x81);
                      out.write(len);
                  } else {
                      out.write(0x82);
                      out.write((len >> 8) & 0xFF);
                      out.write(len & 0xFF);
                  }
                  out.write(body);
                  return out.toByteArray();
              }

              static byte[] rdn(byte[] oid, String val) throws IOException {
                  byte[] str = derTag(0x0C, val.getBytes(StandardCharsets.UTF_8));
                  return derTag(0x31, derTag(0x30, derTag(0x06, oid), str));
              }

              public static void main(String[] args) throws Exception {
                  String keystorePath = args[0];
                  String storePass = args[1];
                  String keyAlias = args[2];
                  String keyPass = args[3];
                  String seed = args[4];

                  BigInteger e = BigInteger.valueOf(65537);
                  BigInteger p = derivePrime("PRIME_P", seed);
                  BigInteger q = derivePrime("PRIME_Q", seed);
                  if (p.compareTo(q) < 0) {
                      BigInteger tmp = p; p = q; q = tmp;
                  }
                  BigInteger n = p.multiply(q);
                  BigInteger p1 = p.subtract(BigInteger.ONE);
                  BigInteger q1 = q.subtract(BigInteger.ONE);
                  BigInteger phi = p1.multiply(q1);
                  BigInteger d = e.modInverse(phi);
                  BigInteger dP = d.mod(p1);
                  BigInteger dQ = d.mod(q1);
                  BigInteger qInv = q.modInverse(p);

                  KeyFactory kf = KeyFactory.getInstance("RSA");
                  PrivateKey priv = kf.generatePrivate(new RSAPrivateCrtKeySpec(n, e, d, p, q, dP, dQ, qInv));
                  PublicKey pub = kf.generatePublic(new RSAPublicKeySpec(n, e));

                  byte[] algId = derTag(0x30,
                      derTag(0x06, new byte[]{0x2A, (byte)0x86, 0x48, (byte)0x86, (byte)0xF7, 0x0D, 0x01, 0x01, 0x0B}),
                      new byte[]{0x05, 0x00}
                  );

                  byte[] name = derTag(0x30,
                      rdn(new byte[]{0x55, 0x04, 0x06}, "JP"),
                      rdn(new byte[]{0x55, 0x04, 0x0A}, "Akari"),
                      rdn(new byte[]{0x55, 0x04, 0x0B}, "Runami GPS"),
                      rdn(new byte[]{0x55, 0x04, 0x03}, "Akari Runami")
                  );

                  byte[] validity = derTag(0x30,
                      derTag(0x17, "250101000000Z".getBytes(StandardCharsets.US_ASCII)),
                      derTag(0x17, "491231235959Z".getBytes(StandardCharsets.US_ASCII))
                  );

                  byte[] version = derTag(0xA0, new byte[]{0x02, 0x01, 0x02});
                  byte[] serial = new byte[]{0x02, 0x04, 0x01, 0x00, 0x00, 0x01};
                  byte[] spki = pub.getEncoded();
                  byte[] tbs = derTag(0x30, version, serial, algId, name, validity, name, spki);

                  Signature sig = Signature.getInstance("SHA256withRSA");
                  sig.initSign(priv);
                  sig.update(tbs);
                  byte[] sigBytes = sig.sign();

                  ByteArrayOutputStream bitStr = new ByteArrayOutputStream();
                  bitStr.write(0x00);
                  bitStr.write(sigBytes);
                  byte[] certDer = derTag(0x30, tbs, algId, derTag(0x03, bitStr.toByteArray()));

                  CertificateFactory cf = CertificateFactory.getInstance("X.509");
                  X509Certificate cert = (X509Certificate) cf.generateCertificate(new ByteArrayInputStream(certDer));

                  KeyStore ks = KeyStore.getInstance("PKCS12");
                  ks.load(null, storePass.toCharArray());
                  ks.setKeyEntry(keyAlias, priv, keyPass.toCharArray(), new Certificate[]{cert});
                  try (FileOutputStream fos = new FileOutputStream(keystorePath)) {
                      ks.store(fos, storePass.toCharArray());
                  }
              }
          }
          EOF
            java /tmp/GenDeterministicKeystore.java "$KEYSTORE_FILE" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$SEED"
            rm -f /tmp/GenDeterministicKeystore.java
          fi

          echo "Verifying signing certificate fingerprint:"
          keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" | grep -E "Owner:|Serial number:|SHA1:|SHA256:" || true

          cat > keystore.properties <<EOF
          storeFile=release-signing.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Wake Instabox Instance via API
        run: |
          set -euo pipefail
          API_BASE="${INSTABOX_API_BASE%/}"

          if [ -z "${INSTABOX_API_KEY:-}" ]; then
            echo "::warning::INSTABOX_API_KEY is not set in Secrets or Variables. Skipping remote Instabox wake."
            echo "INSTABOX_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Querying Instabox machines list from ${API_BASE}/machines ..."
          LIST_JSON=$(curl -sS -X GET "${API_BASE}/machines" \
            -H "Authorization: Bearer ${INSTABOX_API_KEY}" \
            -H "X-API-Key: ${INSTABOX_API_KEY}" \
            -H "Accept: application/json" || echo "{}")

          TARGET_ID="${INSTABOX_MACHINE_ID:-}"
          if [ -z "$TARGET_ID" ]; then
            TARGET_ID=$(echo "$LIST_JSON" | jq -r '(.machines // .data // [])[0].id // empty' 2>/dev/null || true)
          else
            RESOLVED_ID=$(echo "$LIST_JSON" | jq -r --arg t "$TARGET_ID" '(.machines // .data // [])[] | select(.id == $t or .name == $t) | .id' 2>/dev/null | head -n 1 || true)
            if [ -n "$RESOLVED_ID" ]; then
              TARGET_ID="$RESOLVED_ID"
            fi
          fi

          if [ -z "$TARGET_ID" ]; then
            echo "::warning::Could not resolve Instabox Machine ID from API response. Response: $LIST_JSON"
            echo "INSTABOX_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Resolved Instabox Machine ID: ${TARGET_ID}"
          echo "RESOLVED_MACHINE_ID=${TARGET_ID}" >> "$GITHUB_ENV"
          MACHINE_URL="${API_BASE}/machines/${TARGET_ID}"

          get_machine_state() {
            local resp
            resp=$(curl -sS -X GET "$MACHINE_URL" \
              -H "Authorization: Bearer ${INSTABOX_API_KEY}" \
              -H "X-API-Key: ${INSTABOX_API_KEY}" \
              -H "Accept: application/json" || echo "{}")
            echo "$resp" | jq -r '(.status // .state // .machine.status // .machine.state // .data.status // .data.state // "unknown")' 2>/dev/null | tr '[:upper:]' '[:lower:]'
          }

          STATE=$(get_machine_state)
          echo "Initial Instabox state: ${STATE}"

          if [ "$STATE" != "running" ]; then
            echo "Waking / resuming Instabox instance ${TARGET_ID}..."
            if [ "$STATE" = "stopped" ] || [ "$STATE" = "halted" ]; then
              curl -sS -X POST "${MACHINE_URL}/start" \
                -H "Authorization: Bearer ${INSTABOX_API_KEY}" \
                -H "X-API-Key: ${INSTABOX_API_KEY}" \
                -H "Idempotency-Key: $(uuidgen)" \
                -H "Content-Type: application/json" || true
            else
              HTTP_CODE=$(curl -sS -o /tmp/wake_resp.json -w "%{http_code}" -X POST "${MACHINE_URL}/wake" \
                -H "Authorization: Bearer ${INSTABOX_API_KEY}" \
                -H "X-API-Key: ${INSTABOX_API_KEY}" \
                -H "Idempotency-Key: $(uuidgen)" \
                -H "Content-Type: application/json" || echo "000")
              echo "Wake response HTTP ${HTTP_CODE}"
              STATE=$(get_machine_state)
              if [ "$STATE" != "running" ] && [ "$STATE" != "resuming" ] && [ "$STATE" != "starting" ]; then
                curl -sS -X POST "${MACHINE_URL}/resume" \
                  -H "Authorization: Bearer ${INSTABOX_API_KEY}" \
                  -H "X-API-Key: ${INSTABOX_API_KEY}" \
                  -H "Idempotency-Key: $(uuidgen)" \
                  -H "Content-Type: application/json" || true
              fi
            fi
          fi

          echo "Waiting for Instabox instance to enter 'running' state..."
          READY="false"
          for i in $(seq 1 36); do
            STATE=$(get_machine_state)
            echo "Poll ${i}/36: state=${STATE}"
            if [ "$STATE" = "running" ]; then
              READY="true"
              break
            fi
            if [ "$STATE" = "stopped" ]; then
              curl -sS -X POST "${MACHINE_URL}/start" \
                -H "Authorization: Bearer ${INSTABOX_API_KEY}" \
                -H "X-API-Key: ${INSTABOX_API_KEY}" \
                -H "Idempotency-Key: $(uuidgen)" \
                -H "Content-Type: application/json" || true
            fi
            sleep 5
          done

          if [ "$READY" = "true" ]; then
            echo "Instabox instance is running! Acquiring activity lease..."
            curl -sS -X PUT "${MACHINE_URL}/activity-leases/gh-build-${GITHUB_RUN_ID}" \
              -H "Authorization: Bearer ${INSTABOX_API_KEY}" \
              -H "X-API-Key: ${INSTABOX_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{"ttlSeconds": 3600}' || true
            echo "INSTABOX_READY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Instabox did not reach running state in time; will ensure build completes."
            echo "INSTABOX_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Build Signed APK via Instabox (Version ${{ env.ACTION_VERSION_NAME }})
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          BUILT_ON_INSTABOX="false"
          VERSION_NAME="${ACTION_VERSION_NAME}"

          if [ "${INSTABOX_READY:-false}" = "true" ] && [ -n "${RESOLVED_MACHINE_ID:-}" ]; then
            echo "Preparing workspace archive for Instabox (${RESOLVED_MACHINE_ID})..."
            tar --exclude='./.git' --exclude='./build' --exclude='./app/build' -czf /tmp/project.tar.gz .

            if npx --yes instabox@latest cp /tmp/project.tar.gz "${RESOLVED_MACHINE_ID}:/tmp/project.tar.gz" 2>/dev/null; then
              echo "Executing Gradle build on Instabox instance ${RESOLVED_MACHINE_ID} with versionName=${VERSION_NAME}..."
              REMOTE_CMD="
                set -e
                rm -rf /tmp/runami-build && mkdir -p /tmp/runami-build
                tar -xzf /tmp/project.tar.gz -C /tmp/runami-build
                cd /tmp/runami-build
                for sdk_candidate in \"\$ANDROID_HOME\" \"\$ANDROID_SDK_ROOT\" /data/android-sdk /opt/android-sdk \"\$HOME/Android/Sdk\" /usr/lib/android-sdk; do
                  if [ -n \"\$sdk_candidate\" ] && [ -d \"\$sdk_candidate\" ]; then
                    export ANDROID_HOME=\"\$sdk_candidate\"
                    export ANDROID_SDK_ROOT=\"\$sdk_candidate\"
                    break
                  fi
                done
                chmod +x ./gradlew
                ./gradlew assembleRelease -PversionNameProp=${VERSION_NAME} --stacktrace
              "
              if npx --yes instabox@latest exec "${RESOLVED_MACHINE_ID}" --timeout 600 -- bash -lc "$REMOTE_CMD"; then
                mkdir -p app/build/outputs/apk/release
                npx --yes instabox@latest cp "${RESOLVED_MACHINE_ID}:/tmp/runami-build/app/build/outputs/apk/release/app-release.apk" app/build/outputs/apk/release/app-release.apk && \
                BUILT_ON_INSTABOX="true"
              fi
            fi
          fi

          if [ "$BUILT_ON_INSTABOX" != "true" ]; then
            echo "Completing Gradle assembleRelease build with versionName=${VERSION_NAME}..."
            ./gradlew assembleRelease -PversionNameProp="${VERSION_NAME}" --stacktrace
          fi

          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/Runami-GPS-${VERSION_NAME}.apk"

      - name: Clean Up Signing Keystore
        if: always()
        run: |
          rm -f release-signing.jks keystore.properties

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runami-GPS-${{ env.ACTION_VERSION_NAME }}
          path: |
            app/build/outputs/apk/release/Runami-GPS-${{ env.ACTION_VERSION_NAME }}.apk

      - name: Publish Action Channel Pre-Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Runami GPS ${{ env.ACTION_VERSION_NAME }}
          tag_name: ${{ env.ACTION_VERSION_NAME }}
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/Runami-GPS-${{ env.ACTION_VERSION_NAME }}.apk

      - name: Release Instabox Activity Lease
        if: always()
        run: |
          if [ -n "${INSTABOX_API_KEY:-}" ] && [ -n "${RESOLVED_MACHINE_ID:-}" ]; then
            API_BASE="${INSTABOX_API_BASE%/}"
            curl -sS -X DELETE "${API_BASE}/machines/${RESOLVED_MACHINE_ID}/activity-leases/gh-build-${GITHUB_RUN_ID}" \
              -H "Authorization: Bearer ${INSTABOX_API_KEY}" \
              -H "X-API-Key: ${INSTABOX_API_KEY}" || true
          fi
