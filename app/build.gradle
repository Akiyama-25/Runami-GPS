plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp'
}

def tagName = 'release-1'

android {
    compileSdk 34
    defaultConfig {
        applicationId "Akari.Runami.GPS"
        minSdk 27
        targetSdk 34
        versionCode 6
        versionName tagName
        // testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField("String", "TAG_NAME", "\"${tagName}\"")
    }
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def keystorePropertiesFile = rootProject.file("keystore.properties")
            if (!keystorePropertiesFile.exists()) {
                keystorePropertiesFile = rootProject.file("local.properties")
            }
            def keystoreProperties = new Properties()
            if (keystorePropertiesFile.exists()) {
                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
            }
            def configuredStoreFile = keystoreProperties['storeFile'] ?: System.getenv("KEYSTORE_FILE")
            if (configuredStoreFile != null && !configuredStoreFile.toString().trim().isEmpty()) {
                def resolvedFile = file(configuredStoreFile.toString().trim())
                if (!resolvedFile.exists()) {
                    resolvedFile = rootProject.file(configuredStoreFile.toString().trim())
                }
                storeFile resolvedFile
                storePassword((keystoreProperties['storePassword'] ?: System.getenv("STORE_PASSWORD") ?: "android").toString())
                keyAlias((keystoreProperties['keyAlias'] ?: System.getenv("KEY_ALIAS") ?: "androiddebugkey").toString())
                keyPassword((keystoreProperties['keyPassword'] ?: System.getenv("KEY_PASSWORD") ?: "android").toString())
            } else {
                storeFile file("${rootDir}/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debugConfig
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    flavorDimensions += "version"
    productFlavors {
        foss {
            dimension "version"
            // versionNameSuffix "-foss"
            isDefault true
        }
        full {
            dimension "version"
            versionNameSuffix "-full"
        }
    }

    namespace 'io.github.jqssun.gpssetter'
}

secrets {
    propertiesFileName = ".env"
    defaultPropertiesFileName = ".env.example"
}

dependencies {

    // temporary foss xposed fix from https://github.com/deltazefiro/Amarok-Hider/issues/160
    // compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'com.github.deltazefiro:XposedBridge:main-SNAPSHOT'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:4.3'

    // use microg (apache 2.0) and maplibre (bsd 2-clause)
    fossImplementation 'org.microg.gms:play-services-location:0.3.6.244735'
    fossImplementation ('org.maplibre.gl:android-sdk:11.8.2') 
    /* {
        exclude group: 'com.google.android.gms'
    } */
    fullImplementation 'com.google.android.gms:play-services-location:21.0.1'
    fullImplementation 'com.google.android.gms:play-services-maps:18.1.0'


    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.7.0-alpha01'
    implementation 'androidx.activity:activity-ktx:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0-alpha05'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.datastore:datastore-preferences:1.0.0'
    implementation "androidx.drawerlayout:drawerlayout:1.2.0-alpha01"
    implementation 'androidx.room:room-runtime:2.5.0'
    implementation 'androidx.room:room-ktx:2.5.0'
    ksp 'androidx.room:room-compiler:2.5.0'
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.0-alpha04"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:2.6.0-alpha04"

    implementation "com.google.android.material:material:1.12.0"
    implementation "com.google.dagger:hilt-android:2.55"
    ksp "com.google.dagger:hilt-compiler:2.55"

    // timber
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    implementation 'com.github.lukkass222:virtual-joystick-android:1.13.5'
}